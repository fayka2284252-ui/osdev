[project]
name = "{{name}}"
arch = "i686"
lang = "c"
boot = "mbr"

[build]
# Сколько секторов ядра читать загрузчику (1 сектор = 512 байт).
# 32 сектора = 16 КБ, с запасом для учебного ядра. Увеличь при росте.
kernel_sectors = 32

# asm[0] — это загрузчик (MBR, ровно 512 байт).
# asm[1:] — дополнительные ассемблерные объектники (например, src/isr.asm).
asm = ["src/boot.asm"]

# Список всех .c/.cpp файлов ядра.
# Новый файл добавляй сюда или командой: osdev add <имя.c>
sources = ["src/kernel.c"]

include = ["src"]
linker = "src/linker.ld"
output = "build/{{name}}.img"