[project]
name = "osdev"
version = "0.0.1"
description = "OSDev toolkit for Windows without WSL"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
osdev = "osdev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osdev"]
